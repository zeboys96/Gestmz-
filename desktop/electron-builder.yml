appId: mz.gestmz.desktop
productName: GestMZ
copyright: GestMZ
directories:
  output: dist
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
extraResources:
  - from: www
    to: www
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: GestMZ-Setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  shortcutName: GestMZ
publish:
  provider: github
  owner: zeboys96
  repo: Gestmz-
  releaseType: release
