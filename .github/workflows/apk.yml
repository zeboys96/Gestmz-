name: Gerar APK

on:
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Guardar o supabase-js dentro da app (abre sem depender de uma CDN)
        run: |
          npm install --no-save @supabase/supabase-js@2.45.4
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          test -s www/supabase.js
      - name: Guardar o leitor de códigos (ZXing) dentro da app
        run: |
          npm install --no-save @zxing/library@0.21.3
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.js
          test -s www/zxing.js
          grep -q BrowserMultiFormatReader www/zxing.js
      - run: npx cap add android
      - name: Aplicar a identidade do GestMZ (ícone, splash e cores)
        run: python3 resources/aplicar-android.py
      - name: Confirmar nome e identificador da aplicação
        run: |
          grep -R "mz.gestmz.app" android/app/build.gradle
          grep -R 'name="app_name"' android/app/src/main/res/values/strings.xml
      - run: npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Mostrar o que ficou dentro do APK (nome, identificador e ícone)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package|application-label:|application-icon-" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: GestMZ-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
