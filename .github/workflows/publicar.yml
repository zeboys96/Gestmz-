name: Publicar GestMZ

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Guardar o supabase-js dentro da app (abre sem depender de uma CDN)
        run: |
          npm install --no-save @supabase/supabase-js@2.45.4
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.js
          test -s www/supabase.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
